<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介ページ</title>
</head>
<body>
    <img src="../img/kuroneko-02-02.png" alt="黒猫">

    <h2>一週間の予定</h2>
    <table border="1">
        <tr>
            <th>曜日</th>
            <th>予定</th>
            <th>場所</th>
        </tr>
        <tr>
            <th>月曜日</th>
            <td>授業</td>
            <td>学校</td>
        </tr>
        <tr>
            <th>火曜日</th>
            <td>授業</td>
            <td>家</td>
        </tr>
        <tr>
            <th>水曜日</th>
            <td>授業</td>
            <td>学校</td>
        </tr>
        <tr>
            <th>木曜日</th>
            <td>授業</td>
            <td>学校</td>
        </tr>
        <tr>
            <th>金曜日</th>
            <td>授業</td>
            <td>学校</td>
        </tr>
        <tr>
            <th>土曜日</th>
            <td>休み</td>
            <td>アルバイト</td>
        </tr>
        <tr>
            <th>日曜日</th>
            <td>休み</td>
            <td>アルバイト</td>
        </tr>
    </table>

    <h2>このページの感想を送る</h2>
    <form method="get">
        <dl>
            <dt>
                <label for="visitor-name">お名前</label>
            </dt>
            <dd>
                <input type="text" id="visitor-name" name="visitor-name" required placeholder="ねこ太郎">
            </dd>

            <dt>いちばんよかったところ</dt>
            <dd>
                <label>
                    <input type="radio" name="best" value="photo">写真
                </label>
                <label>
                    <input type="radio" name="best" value="list">好きなもの
                </label>
                <label>
                    <input type="radio" name="best" value="table">予定の表
                </label>
            </dd>

            <dt>
                <label for="comment">感想</label>
            </dt>
            <dd>
                <textarea id="comment" name="comment" rows="4"></textarea>
            </dd>
        </dl>

        <button type="submit">送信する</button>
    </form>
</body>
</html>
