
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常会話チャット</title>
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>

    <header>
        <h1>日常会話チャット</h1>
    </header>

    <main class="chat">

        <div class="message bot">
            <p>こんにちは！今日はどんな一日でしたか？</p>
        </div>

        <div class="message user">
            <p>今日は学校に行ってきました。</p>
        </div>

        <div class="message bot">
            <p>お疲れさまです！授業はどうでしたか？</p>
        </div>

        <div class="message user">
            <p>プログラミングの授業がありました。</p>
        </div>

        <div class="message bot">
            <p>プログラミングは面白そうですね。今日は何を勉強したんですか？</p>
        </div>

        <div class="message user">
            <p>HTMLとCSSについて勉強しました。自分で画面のデザインを作るのは少し難しいですが、完成すると楽しいです！</p>
        </div>

    </main>

    <footer>
        <input type="text" placeholder="メッセージを入力...">
        <button>送信</button>
    </footer>

</body>
</html>
